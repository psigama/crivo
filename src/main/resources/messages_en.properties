# The English translation of messages.properties (SPEC 0.28, section 1.5), key for key.
#
# Portuguese is the language of origin: this file translates it and never says anything the
# Portuguese one does not. A key missing here shows up in Portuguese on an English page.
#
# "Consulente" is the sitter of the literature (SPEC glossary), so in English it is "sitter".
# "Crivo", "PsiGama" and "AIR Lab" are names and do not translate; neither does a protocol label
# such as P1-automatico, which is a public identifier.

