# Implantação manual na VM de produção (app.crivo.psigama.com; até a virada, crivo.psigama.com).
#
# Só a aplicação passa por aqui. O site estático com as páginas editoriais é publicado pelo pages.yml, a
# cada push na main, sem passar pela VM (SPEC 0.21, seção 1.3).
#
# Só roda quando acionado à mão, porque a Constitution (regra de implantação 8) permite atualizar a
# aplicação apenas entre sessões de coleta, nunca durante um estudo em andamento. Quem aciona confirma
# isso no formulário do workflow; o ambiente "production" do GitHub pode, além disso, exigir aprovação.
#
# O workflow entra na VM por SSH, só com chave, como um usuário que só pode trocar o JAR e reiniciar o
# serviço, e confere a identidade da VM contra a chave fixada em DEPLOY_KNOWN_HOSTS. O JAR é o mesmo
# artefato de todas as fases, construído e testado aqui, e a troca de versão guarda a anterior e volta
# para ela se a aplicação não ficar saudável.
#
# Configuração, segredos e preparo da VM: docs/DEPLOY.md.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Confirmo que nenhuma sessão de coleta está em andamento (Constitution, regra de implantação 8)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Construir e testar o JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Exigir a confirmação
        if: ${{ !inputs.confirmacao }}
        run: |
          echo "::error::Implantação recusada: confirme que nenhuma sessão de coleta está em andamento."
          exit 1

      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar o JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar e rodar os testes
        run: ./mvnw -B -ntp verify

      - name: Calcular o SHA-256 do JAR
        working-directory: target
        run: sha256sum airlab.jar | tee airlab.jar.sha256

      - name: Guardar o JAR
        uses: actions/upload-artifact@v7
        with:
          name: airlab-${{ github.sha }}
          path: |
            target/airlab.jar
            target/airlab.jar.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Implantar na VM
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.APP_URL || 'https://crivo.psigama.com' }}
    steps:
      - name: Conferir os segredos
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta o segredo $name no ambiente production (ver docs/DEPLOY.md)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Baixar o JAR
        uses: actions/download-artifact@v8
        with:
          name: airlab-${{ github.sha }}
          path: release

      - name: Conferir o SHA-256
        working-directory: release
        run: sha256sum -c airlab.jar.sha256

      - name: Preparar o SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host crivo-vm
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Enviar o JAR
        run: scp release/airlab.jar crivo-vm:airlab.jar.new

      - name: Trocar a versão e conferir a saúde
        run: |
          ssh crivo-vm 'bash -s' <<'REMOTO'
          set -euo pipefail
          novo="$HOME/airlab.jar.new"
          app=/opt/airlab/airlab.jar
          anterior=/opt/airlab/airlab.jar.previous

          if [ -f "$app" ]; then
            sudo /usr/bin/install -o airlab -g airlab -m 0644 "$app" "$anterior"
          fi
          sudo /usr/bin/install -o airlab -g airlab -m 0644 "$novo" "$app"
          sudo /usr/bin/systemctl restart airlab

          saudavel() {
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                return 0
              fi
              sleep 3
            done
            return 1
          }

          if saudavel; then
            rm -f "$novo"
            echo "Nova versão no ar e saudável."
          else
            echo "A nova versão não ficou saudável; voltando para a anterior." >&2
            if [ -f "$anterior" ]; then
              sudo /usr/bin/install -o airlab -g airlab -m 0644 "$anterior" "$app"
              sudo /usr/bin/systemctl restart airlab
            fi
            exit 1
          fi
          REMOTO
